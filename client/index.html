<!doctype html>
<html lang="en" translate="no">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Browser auto-translation (Chrome/Google Translate) rewrites text/DOM
         nodes underneath React, which corrupts the reconciler and throws
         "NotFoundError: Failed to execute 'removeChild'". Opt the app out so a
         user with translate-on (e.g. a Spanish-speaking sub) can't crash it. -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <title>The Bolted Iron Hub</title>
